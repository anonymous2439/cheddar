<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cheddar</title>
<link rel="stylesheet" href="{{styleUri}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Hairline&family=MedievalSharp&family=Nosifer&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="msg">
            <div class="msg-options">
                <div id="game-lobby">
                    <p id="game-hint">/games to browse, /lobby create &lt;n&gt; to host</p>
                    <ul id="game-catalog"></ul>
                    <div id="lobby-view" style="display:none">
                        <p id="lobby-title"></p>
                        <ul id="lobby-players"></ul>
                        <ul id="lobby-actions">
                            <li><button type="button" id="lobby-ready">Ready</button></li>
                            <li><button type="button" id="lobby-start" style="display:none">Start</button></li>
                            <li><button type="button" id="lobby-invite-btn">Invite</button></li>
                            <li><button type="button" id="lobby-leave">Leave</button></li>
                        </ul>
                        <div id="lobby-invite-row" style="display:none">
                            <input type="text" id="lobby-invite-input" placeholder="username" autocomplete="off" spellcheck="false" />
                            <button type="button" id="lobby-invite-send">Send</button>
                        </div>
                        <p id="lobby-hint"></p>
                    </div>
                    <button type="button" id="lobby-rejoin" style="display:none">Rejoin Game in Progress</button>
                    <div id="game-stage" style="display:none"></div>
                    <button type="button" id="lobby-restart" style="display:none">Back to Lobby</button>

                    <div id="replay-view" style="display:none">
                        <div style="display:flex; align-items:center; justify-content:space-between;">
                            <strong>🏇 Race Replay</strong>
                            <button type="button" id="replay-close">✕</button>
                        </div>
                        <div id="replay-track"></div>
                        <p id="replay-status"></p>
                        <ul id="replay-standings"></ul>
                        <button type="button" id="replay-again" style="display:none">▶ Watch again</button>
                    </div>
                </div>
            </div>
            <div id="msg-users">
                <div id="game-drawer-lock"></div>
                <div id="msg-content"></div>
            </div>
        </div>
        <div id="user-actions">
            <span id="user-action-label">$</span>
            <input id="textbox" autocomplete="off" spellcheck="false" />
            <span id="chat-title"></span>
        </div>
    </div>

    {{gameScripts}}
    <script src="{{scriptUri}}"></script>
</body>
</html>
